<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Paivapo Institution | A Community Library in Masvingo, Zimbabwe</title>
  <meta name="description" content="Paivapo Institution is a community library in Masvingo, Zimbabwe dedicated to collecting, preserving, and sharing books across art, ecology, and literature.">
  <meta name="theme-color" content="#F4F1EA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="is-canvas-page">

  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Header: transparent, floats over the canvas. main.js turns the list into the gooey nav. -->
  <header class="header header--float" role="banner">
    <div class="header__inner">
      <nav class="nav" aria-label="Main navigation">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link nav__link--active">Paivapo</a></li>
          <li><a href="index.html#about" class="nav__link" data-i18n="nav.about">About</a></li>
          <li><a href="index.html#visit" class="nav__link" data-i18n="nav.visit">Visit</a></li>
          <li><a href="index.html#support" class="nav__link" data-i18n="nav.support">Support</a></li>
          <li><a href="index.html#contact" class="nav__link" data-i18n="nav.contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">

    <!-- Infinite canvas of the whole collection. Drag, scroll or use the arrow keys to pan; click a book for details. -->
    <section class="canvas" id="book-canvas" tabindex="0" aria-label="The Paivapo collection. Drag, scroll or use the arrow keys to move around; press Enter on a book for details.">
      <div class="page-loader" id="canvas-loader">
        <div class="book-loader"><div class="inner"><div class="left"></div><div class="middle"></div><div class="right"></div></div><ul><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li></ul></div>
      </div>

      <div class="canvas__matrix">
        <!-- 3 x 3 blocks of the collection, populated by main.js -->
      </div>

      <a class="canvas__list-link" href="catalog.html" id="canvas-list-link">Browse all titles</a>
    </section>

    <!-- Nav panels: About, Visit, Support, Contact open here without leaving the page -->
    <div class="scrim" id="panel-scrim" hidden></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
      <div class="panel__head">
        
        <button class="panel__close" id="panel-close" aria-label="Close">&times;</button>
      </div>
      <div class="panel__scroll" id="panel-body"></div>
    </aside>

    <!-- Book Detail Modal (shared with the catalogue page) -->
    <div class="book-modal" id="book-modal" role="dialog" aria-modal="true" aria-label="Book details" hidden>
      <div class="book-modal__overlay" id="book-modal-overlay"></div>
      <div class="book-modal__content">
        <button class="book-modal__close" id="book-modal-close" aria-label="Close">&times;</button>
        <div class="book-modal__cover" id="book-modal-cover"></div>
        <div class="book-modal__info" id="book-modal-info"></div>
      </div>
    </div>

  </main>

  <button class="lang-toggle lang-toggle--corner" aria-label="Switch to Shona">SN</button>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
